spring.application.name=availability-processor
server.port=${SERVER_PORT:5000}
wiremock.base-url=${WIREMOCK_BASE_URL:http://localhost:8080}
availability.retry.max-attempts=${AVAILABILITY_RETRY_MAX_ATTEMPTS:3}
availability.retry.base-delay=${AVAILABILITY_RETRY_BASE_DELAY:100ms}
spring.datasource.url=${AVAILABILITY_DATABASE_URL:jdbc:h2:file:./data/availability;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${AVAILABILITY_DATABASE_USERNAME:sa}
spring.datasource.password=${AVAILABILITY_DATABASE_PASSWORD:}
spring.sql.init.mode=always
availability.outbox.poll-delay-ms=${AVAILABILITY_OUTBOX_POLL_DELAY_MS:5000}
availability.outbox.initial-delay-ms=${AVAILABILITY_OUTBOX_INITIAL_DELAY_MS:1000}
availability.outbox.recovery-enabled=${AVAILABILITY_OUTBOX_RECOVERY_ENABLED:true}
